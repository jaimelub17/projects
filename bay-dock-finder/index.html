<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dock Finder">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Dock Finder — Bay Wheels</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
  :root{
    --bg:#ffffff; --sheet:#ffffff; --ink:#0f1115; --muted:#5b6472; --line:#e4e7ec;
    --accent:#e5009f; --accent-ink:#ffffff; --good:#0a7c46; --warn:#b25e00; --bad:#c02626;
    --live:#2f7ef6; --chip:#f2f4f7; --shadow:0 -2px 28px rgba(0,0,0,.16);
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#0f1115; --sheet:#171a20; --ink:#f2f4f7; --muted:#98a2b3; --line:#2a2f39;
           --chip:#232833; --good:#3ddc91; --warn:#f2b544; --bad:#ff7a7a; --accent:#ff3fce;
           --shadow:0 -2px 28px rgba(0,0,0,.55); }
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    color:var(--ink); background:var(--bg); overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
  }
  #map{position:fixed;inset:0}
  .leaflet-container{background:var(--bg); font:inherit}

  /* ---------- search ---------- */
  #searchWrap{
    position:fixed; top:0; left:0; right:0; z-index:1000;
    padding:calc(env(safe-area-inset-top) + 10px) 10px 0;
    pointer-events:none;
  }
  #searchBar{
    pointer-events:auto;
    display:flex; align-items:center; gap:8px; background:var(--sheet);
    border:1px solid var(--line); border-radius:14px; padding:9px 11px;
    box-shadow:0 4px 20px rgba(0,0,0,.18);
  }
  #q{
    flex:1; border:0; background:transparent; color:var(--ink);
    font-size:16px; outline:none; min-width:0; /* 16px keeps iOS from zooming on focus */
  }
  #q::placeholder{color:var(--muted)}
  .iconbtn{
    border:0; background:var(--chip); color:var(--ink); width:34px; height:34px;
    border-radius:50%; font-size:16px; cursor:pointer; flex:none; line-height:1;
    display:flex; align-items:center; justify-content:center; padding:0;
    transition:background .15s, color .15s;
  }
  #locBtn.live{background:var(--live); color:#fff}
  #locBtn.asking{background:var(--chip); color:var(--live); animation:pulse 1.1s infinite}
  #locBtn.denied{background:var(--chip); color:var(--bad)}
  @keyframes pulse{50%{opacity:.42}}
  #results{
    pointer-events:auto;
    margin-top:6px; background:var(--sheet); border:1px solid var(--line);
    border-radius:14px; box-shadow:0 4px 20px rgba(0,0,0,.18);
    max-height:52vh; overflow-y:auto; -webkit-overflow-scrolling:touch; display:none;
  }
  #results.on{display:block}
  .res{padding:12px 13px; border-bottom:1px solid var(--line); cursor:pointer}
  .res:last-child{border-bottom:0}
  .res:active{background:var(--chip)}
  .res b{display:block; font-weight:600}
  .res span{color:var(--muted); font-size:13px}
  .res.hint{color:var(--muted); cursor:default}

  /* ---------- bottom sheet ---------- */
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:1000;
    background:var(--sheet); border-top:1px solid var(--line);
    border-radius:18px 18px 0 0; box-shadow:var(--shadow);
    padding:0 14px calc(env(safe-area-inset-bottom) + 16px);
    max-height:74vh; overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    transform:translateY(101%); transition:transform .26s cubic-bezier(.32,.72,0,1);
    will-change:transform;
  }
  @supports (max-height:100dvh){ #sheet{max-height:74dvh} }
  #sheet.on{transform:none}
  body.searching #sheet{transform:translateY(101%)}
  #gripWrap{
    position:sticky; top:0; z-index:2; background:var(--sheet);
    padding:9px 0 7px; margin:0 -14px; cursor:grab; touch-action:none;
  }
  #grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}

  /* collapsed peek bar, so a dismissed sheet is one tap from coming back */
  #peek{
    position:fixed; left:10px; right:10px; z-index:999;
    bottom:calc(env(safe-area-inset-bottom) + 12px);
    background:var(--sheet); border:1px solid var(--line); border-radius:14px;
    box-shadow:var(--shadow); padding:11px 14px; cursor:pointer;
    transform:translateY(160%); transition:transform .26s cubic-bezier(.32,.72,0,1);
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  #peek.on{transform:none}
  #peek b{font-size:14.5px; font-weight:650; display:block}
  #peek .meta{font-size:12.5px}

  h2{font-size:17px;margin:0 0 2px}
  .sub{color:var(--muted); font-size:13px; margin:0 0 12px}

  #modes{display:flex; gap:5px; background:var(--chip); border-radius:11px; padding:3px; margin-bottom:12px}
  #modes button{
    flex:1; border:0; background:transparent; color:var(--muted); cursor:pointer;
    font:inherit; font-size:13.5px; font-weight:650; padding:8px 6px; border-radius:9px;
    transition:background .15s, color .15s;
  }
  #modes button.on{background:var(--sheet); color:var(--ink); box-shadow:0 1px 5px rgba(0,0,0,.2)}

  .card{border:1px solid var(--line); border-radius:14px; padding:12px; margin-bottom:10px}
  .card.primary{border-color:var(--accent); border-width:2px}
  .lbl{
    font-size:11px; letter-spacing:.07em; text-transform:uppercase;
    color:var(--muted); font-weight:700; margin-bottom:5px;
    display:flex; justify-content:space-between; gap:8px; align-items:center;
  }
  .lbl .undo{
    text-transform:none; letter-spacing:0; font-size:12px; font-weight:650;
    color:var(--accent); cursor:pointer; flex:none;
  }
  .name{font-size:16.5px; font-weight:650; margin-bottom:4px}
  .meta{font-size:13px; color:var(--muted)}
  .stat{font-weight:700}
  .good{color:var(--good)} .warn{color:var(--warn)} .bad{color:var(--bad)}
  .live{color:var(--live); font-weight:650}
  .row{display:flex; gap:8px; margin-top:11px; flex-wrap:wrap}
  .btn{
    flex:1 1 auto; text-align:center; text-decoration:none; padding:11px 12px;
    border-radius:11px; font-weight:650; font-size:14px;
    background:var(--chip); color:var(--ink); border:0; cursor:pointer;
  }
  .btn:active{opacity:.7}
  .btn.go{background:var(--accent); color:var(--accent-ink)}
  details{margin:0 0 10px}
  summary{cursor:pointer; color:var(--muted); font-size:13px; padding:7px 0; list-style:none}
  summary::-webkit-details-marker{display:none}
  summary::after{content:' ›'; display:inline-block; transform:rotate(90deg); opacity:.6}
  .alt{
    display:flex; justify-content:space-between; gap:10px; align-items:center;
    padding:10px 0; border-top:1px solid var(--line); font-size:14px; cursor:pointer;
  }
  .alt:active{opacity:.6}
  .alt .meta{font-size:12px}
  #foot{color:var(--muted); font-size:11.5px; margin:12px 0 0; text-align:center}

  /* ---------- map markers ---------- */
  .pin{
    display:flex; align-items:center; justify-content:center;
    border-radius:50%; font-size:13px; font-weight:700; color:#fff;
    border:2px solid #fff; box-shadow:0 1px 7px rgba(0,0,0,.45);
  }
  .pin-park{background:var(--accent); width:34px; height:34px; font-size:15px}
  .pin-start{background:#0a7c46; width:30px; height:30px}
  .pin-dest{background:#1b2330; width:28px; height:28px}
  .pin-alt{background:var(--sheet); color:var(--ink); width:25px; height:25px;
           font-size:11.5px; border-color:var(--accent)}
  .pin-me{
    width:18px; height:18px; border-radius:50%; background:var(--live);
    border:2.5px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.18), 0 2px 6px rgba(0,0,0,.4);
  }
  #toast{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); z-index:1200;
    background:rgba(20,22,28,.94); color:#fff; padding:12px 16px; border-radius:12px;
    font-size:14px; display:none; max-width:78vw; text-align:center; line-height:1.4;
  }
  #toast.on{display:block}
</style>
</head>
<body>

<div id="map"></div>

<div id="searchWrap">
  <div id="searchBar">
    <button class="iconbtn" id="locBtn" title="Follow my location" aria-label="Follow my location">◎</button>
    <input id="q" placeholder="Where are you riding to?" autocomplete="off"
           enterkeyhint="search" autocapitalize="words" autocorrect="off">
    <button class="iconbtn" id="clearBtn" title="Clear" aria-label="Clear">×</button>
  </div>
  <div id="results"></div>
</div>

<div id="peek"></div>

<div id="sheet">
  <div id="gripWrap"><div id="grip"></div></div>
  <div id="sheetBody"></div>
  <div id="foot"></div>
</div>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
/* ============================================================
   Dock Finder — the Bay Wheels rack with a free dock nearest
   wherever you're going.
   Data: Lyft GBFS. Geocode: Photon / Nominatim. Route: OSRM.
   ============================================================ */

var GBFS_INFO   = 'https://gbfs.lyft.com/gbfs/1.1/bay/en/station_information.json';
var GBFS_STATUS = 'https://gbfs.lyft.com/gbfs/1.1/bay/en/station_status.json';
var OSRM        = 'https://routing.openstreetmap.de/routed-bike/route/v1/bike/';
var BBOX        = [-122.65, 37.20, -121.70, 38.15];  // Bay Area, lon/lat
var REFRESH_MS  = 60000;   // GBFS ttl is 60s
var WALK_MPM    = 80;      // metres walked per minute
var TIE_M       = 150;     // racks this close to each other count as the same spot
var REPLAN_M    = 70;      // move this far and the plan is recomputed
var REPLAN_MS   = 25000;   // ...or this long since the last one, whichever first

var map, stations = new Map(), statusAt = 0;
var me = null, dest = null, plan = null;
var mode = 'riding';       // 'riding' = already on a bike | 'need' = still need one
var pinnedParkId = null;   // a rack you chose by hand; survives auto-refresh
var follow = true;         // keep the map centred on you until you pan away
var watchId = null, geoState = 'off';   // off | asking | live | denied
var geoErrShown = false, coarseTried = false;
var layers = { route:null, pins:[], me:null, acc:null };
var routeToken = 0, lastRouteKey = null, lastRoute = null;
var lastPlanAt = 0, lastPlanPos = null;

/* ---------- helpers ---------- */
function $(s){ return document.querySelector(s); }
function all(root, s){ return Array.prototype.slice.call(root.querySelectorAll(s)); }

function haversine(a, b){
  var R = 6371000, r = Math.PI/180;
  var dLat = (b.lat-a.lat)*r, dLon = (b.lon-a.lon)*r;
  var s = Math.pow(Math.sin(dLat/2),2) +
          Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.pow(Math.sin(dLon/2),2);
  return 2*R*Math.asin(Math.sqrt(s));
}
function walkMin(m){ return Math.max(1, Math.round(m/WALK_MPM)); }
function fmtDist(m){
  var ft = m*3.28084;
  return ft < 1000 ? Math.round(ft/10)*10 + ' ft' : (m/1609.34).toFixed(1) + ' mi';
}
function toast(msg, ms){
  var t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t);
  if (ms !== 0) toast._t = setTimeout(function(){ t.classList.remove('on'); }, ms || 2600);
}
function hideToast(){ $('#toast').classList.remove('on'); }
function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
  });
}
/* Google Maps deep link. mode: walking | bicycling */
function gmaps(from, to, mode){
  var o = from ? '&origin=' + from.lat + ',' + from.lon : '';
  return 'https://www.google.com/maps/dir/?api=1' + o +
         '&destination=' + to.lat + ',' + to.lon + '&travelmode=' + mode;
}

/* ---------- map ---------- */
function initMap(){
  map = L.map('map', { zoomControl:false, attributionControl:false, tap:false })
         .setView([37.7749,-122.4194], 13);
  // OpenStreetMap's own tiles: no key, no watermark. (CARTO's free basemaps
  // now stamp "API KEY REQUIRED" across every tile.)
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
    { maxZoom:19, crossOrigin:true }).addTo(map);
  L.control.attribution({ position:'topright', prefix:false })
   .addAttribution('&copy; OpenStreetMap &middot; Lyft GBFS').addTo(map);

  // Panning by hand means you want to look around; stop yanking the map back.
  map.on('dragstart', function(){ setFollow(false); });
  map.on('contextmenu', function(e){ dropPin(e.latlng.lat, e.latlng.lng); });
  wireLongPress();
}

function dropPin(lat, lon){
  setDest({ lat:lat, lon:lon, label:'Dropped pin', sub:'Point on map' });
}

/* iOS Safari never fires `contextmenu`, so long-press is done by hand. */
function wireLongPress(){
  var el = map.getContainer(), timer = null, sx = 0, sy = 0;
  function cancel(){ if (timer){ clearTimeout(timer); timer = null; } }
  el.addEventListener('touchstart', function(e){
    if (e.touches.length !== 1) { cancel(); return; }
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
    cancel();
    timer = setTimeout(function(){
      timer = null;
      var r = el.getBoundingClientRect();
      var ll = map.containerPointToLatLng(L.point(sx - r.left, sy - r.top));
      if (navigator.vibrate) navigator.vibrate(15);
      dropPin(ll.lat, ll.lng);
    }, 550);
  }, { passive:true });
  el.addEventListener('touchmove', function(e){
    if (!timer) return;
    var dx = e.touches[0].clientX - sx, dy = e.touches[0].clientY - sy;
    if (Math.sqrt(dx*dx + dy*dy) > 12) cancel();
  }, { passive:true });
  el.addEventListener('touchend', cancel, { passive:true });
  el.addEventListener('touchcancel', cancel, { passive:true });
}

function pin(pt, cls, html, title, onTap){
  var m = L.marker([pt.lat, pt.lon], {
    title: title,
    icon: L.divIcon({ className:'', html:'<div class="pin '+cls+'">'+(html||'')+'</div>',
                      iconSize:[34,34], iconAnchor:[17,17] })
  }).addTo(map);
  if (onTap) m.on('click', function(e){ L.DomEvent.stop(e); onTap(); });
  layers.pins.push(m);
  return m;
}
/* Clears plan graphics only — never the live "you are here" marker. */
function clearPlanLayers(){
  layers.pins.forEach(function(m){ map.removeLayer(m); });
  layers.pins = [];
  if (layers.route){ map.removeLayer(layers.route); layers.route = null; }
  lastRouteKey = null;
}

/* ---------- live location ---------- */
function setGeo(s){
  geoState = s;
  var b = $('#locBtn');
  b.className = 'iconbtn' + (s === 'live' && follow ? ' live' : s === 'asking' ? ' asking'
                            : s === 'denied' ? ' denied' : '');
}
function setFollow(v){
  follow = v;
  setGeo(geoState);
}
function startWatch(interactive){
  if (!navigator.geolocation){
    if (interactive) toast('This browser has no location access.', 4000);
    return;
  }
  // A healthy watch that's already giving fixes: just re-follow.
  if (watchId !== null && geoState === 'live'){
    setFollow(true);
    if (me) recenterOnMe(Math.max(map.getZoom(), 16));
    return;
  }
  // Otherwise tear the old watch down and genuinely retry. Without this, a
  // watch that was denied or timed out stays wedged and ◎ does nothing, even
  // after you've fixed the permission in Settings.
  if (watchId !== null){
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  if (interactive) geoErrShown = false;   // a deliberate tap deserves an answer
  coarseTried = false;
  setGeo('asking');
  setFollow(true);
  watchId = navigator.geolocation.watchPosition(onPos, onGeoErr, {
    enableHighAccuracy:true, maximumAge:4000, timeout:20000
  });
}
function onPos(pos){
  var prev = me;
  me = { lat:pos.coords.latitude, lon:pos.coords.longitude,
         acc:pos.coords.accuracy || 0 };
  setGeo('live');
  geoErrShown = false;
  drawMe();
  if (follow) recenterOnMe(dest ? map.getZoom() : Math.max(map.getZoom(), 16));
  maybeReplan(prev);
}

/* Animated pans ride on requestAnimationFrame, which the browser throttles when
   the app is hidden — a pan queued with the screen off would simply never land.
   Glide for the short hops you can actually see; jump for everything else. */
function recenterOnMe(zoom){
  if (!me) return;
  var c = map.getCenter();
  var jump = document.hidden
          || map.getZoom() !== zoom
          || haversine(me, { lat:c.lat, lon:c.lng }) > 400;
  map.setView([me.lat, me.lon], zoom, { animate:!jump, duration:.6 });
}
/* watchPosition can fire errors over and over — say something useful once,
   and say which of the three failures it actually was. */
function onGeoErr(err){
  var code = err && err.code;
  if (code === 1){
    setGeo('denied');
    if (!geoErrShown){
      geoErrShown = true;
      toast('Location is blocked for this site. Allow it, then tap ◎ again.', 5200);
    }
    return;
  }
  setGeo('off');
  // High accuracy indoors often just times out; coarse usually still answers.
  if (code === 3 && !coarseTried){
    coarseTried = true;
    if (watchId !== null){ navigator.geolocation.clearWatch(watchId); }
    watchId = navigator.geolocation.watchPosition(onPos, onGeoErr, {
      enableHighAccuracy:false, maximumAge:30000, timeout:45000
    });
    return;
  }
  if (!geoErrShown){
    geoErrShown = true;
    toast(code === 3
      ? 'No GPS fix yet. Outdoors it locks on quickly — tap ◎ to retry.'
      : 'Location is unavailable right now. Tap ◎ to retry.', 5200);
  }
}
function drawMe(){
  if (!me) return;
  var ll = [me.lat, me.lon];
  if (!layers.me){
    layers.me = L.marker(ll, {
      interactive:false, zIndexOffset:1000,
      icon: L.divIcon({ className:'', html:'<div class="pin-me"></div>',
                        iconSize:[18,18], iconAnchor:[9,9] })
    }).addTo(map);
    layers.acc = L.circle(ll, { radius:me.acc, color:'#2f7ef6', weight:1,
                                opacity:.35, fillOpacity:.09, interactive:false }).addTo(map);
  } else {
    layers.me.setLatLng(ll);
    layers.acc.setLatLng(ll).setRadius(me.acc);
  }
}
/* A GPS tick every second must not mean a re-route every second. */
function maybeReplan(prev){
  if (!dest) return;
  var moved = prev ? haversine(prev, me) : Infinity;
  var stale = Date.now() - lastPlanAt > REPLAN_MS;
  if (moved > REPLAN_M || stale) buildPlan();
  else updateLiveBits();
}

/* ---------- GBFS ---------- */
function applyStatus(list){
  list.forEach(function(s){
    var t = stations.get(s.station_id);
    if (!t) return;
    t.docks     = s.num_docks_available;
    t.ebikes    = s.num_ebikes_available || 0;
    t.bikes     = s.num_bikes_available || 0;
    t.renting   = s.is_renting === 1 && s.is_installed === 1;
    t.returning = s.is_returning === 1 && s.is_installed === 1;
    t.reported  = s.last_reported;
  });
  statusAt = Date.now();
}
function loadStations(){
  return Promise.all([
    fetch(GBFS_INFO).then(function(r){ return r.json(); }),
    fetch(GBFS_STATUS).then(function(r){ return r.json(); })
  ]).then(function(res){
    var byId = new Map();
    res[0].data.stations.forEach(function(s){
      byId.set(s.station_id, {
        id:s.station_id, name:s.name, lat:s.lat, lon:s.lon,
        capacity:s.capacity, ebikeOnly: s.station_type === 'lightweight'
      });
    });
    stations = byId;
    applyStatus(res[1].data.stations);
  });
}
function refreshStatus(){
  return fetch(GBFS_STATUS).then(function(r){ return r.json(); })
    .then(function(d){ applyStatus(d.data.stations); });
}

/* nearest N stations to `pt` that pass `ok` */
function nearest(pt, ok, n){
  var out = [];
  stations.forEach(function(s){
    if (!ok(s)) return;
    var c = {}; for (var k in s) c[k] = s[k];
    c.dist = haversine(pt, s);
    out.push(c);
  });
  out.sort(function(a,b){ return a.dist - b.dist; });
  return out.slice(0, n);
}
/* Among racks all within a block of the closest, the useful pick is the one
   with the most free docks — not the one that happens to be 3 m nearer. */
function preferRoomiest(list){
  if (list.length < 2) return list;
  var floor = list[0].dist + TIE_M;
  var tied = list.filter(function(s){ return s.dist <= floor; });
  if (tied.length < 2) return list;
  tied.sort(function(a,b){ return b.docks - a.docks || a.dist - b.dist; });
  var best = tied[0];
  return [best].concat(list.filter(function(s){ return s.id !== best.id; }));
}

/* ---------- geocoding ---------- */
function geocode(q){
  var bb = 'bbox=' + BBOX.join(',');
  return fetch('https://photon.komoot.io/api/?limit=6&lat=37.7749&lon=-122.4194&'
               + bb + '&q=' + encodeURIComponent(q))
    .then(function(r){ return r.json(); })
    .then(function(d){
      var hits = (d.features || []).map(function(f){
        var p = f.properties, c = f.geometry.coordinates;
        var line2 = [ (p.housenumber && p.street) ? p.housenumber + ' ' + p.street : p.street,
                      p.city, p.state ].filter(Boolean).join(', ');
        return { lat:c[1], lon:c[0], label: p.name || p.street || q, sub: line2 };
      });
      if (hits.length) return hits;
      throw new Error('empty');
    })
    .catch(function(){
      var vb = BBOX[0] + ',' + BBOX[3] + ',' + BBOX[2] + ',' + BBOX[1];
      return fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&bounded=1'
                   + '&viewbox=' + vb + '&q=' + encodeURIComponent(q))
        .then(function(r){ return r.json(); })
        .then(function(d){
          return d.map(function(x){
            return { lat:+x.lat, lon:+x.lon,
                     label: x.name || x.display_name.split(',')[0],
                     sub: x.display_name.split(',').slice(1,4).join(',').trim() };
          });
        });
    });
}

/* ---------- routing ---------- */
function decodePolyline(str){
  var i = 0, lat = 0, lon = 0, pts = [], b, shift, res;
  while (i < str.length){
    shift = 0; res = 0;
    do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lat += (res & 1) ? ~(res >> 1) : (res >> 1);
    shift = 0; res = 0;
    do { b = str.charCodeAt(i++) - 63; res |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
    lon += (res & 1) ? ~(res >> 1) : (res >> 1);
    pts.push([lat/1e5, lon/1e5]);
  }
  return pts;
}
function bikeRoute(a, b){
  var url = OSRM + a.lon + ',' + a.lat + ';' + b.lon + ',' + b.lat
          + '?overview=full&geometries=polyline';
  return fetch(url).then(function(r){ return r.json(); }).then(function(d){
    if (d.code !== 'Ok' || !d.routes.length) throw new Error('no route');
    return { pts: decodePolyline(d.routes[0].geometry),
             dist: d.routes[0].distance, dur: d.routes[0].duration };
  });
}
/* Where the ride begins: you, if you're already on a bike; else the pickup rack. */
function rideOrigin(){
  if (mode === 'riding') return me;
  return (plan && plan.start) ? plan.start : null;
}
function drawRoute(){
  var from = rideOrigin();
  if (!plan || !plan.park || !from) return;
  // Round the origin so tiny GPS jitter doesn't trigger a fresh request.
  var key = from.lat.toFixed(4) + ',' + from.lon.toFixed(4) + '>' + plan.park.id;
  if (key === lastRouteKey && layers.route){ paintRideMeta(lastRoute); return; }

  var token = ++routeToken;                 // guards against out-of-order replies
  bikeRoute(from, plan.park).then(function(r){
    if (token !== routeToken) return;       // a newer request already won
    if (layers.route) map.removeLayer(layers.route);
    layers.route = L.polyline(r.pts, {
      color:getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#e5009f',
      weight:5, opacity:.85, lineJoin:'round'
    }).addTo(map);
    lastRouteKey = key; lastRoute = r;
    paintRideMeta(r);
  }).catch(function(){
    if (token === routeToken) paintRideMeta(null);
  });
}
function paintRideMeta(r){
  var el = $('#rideMeta');
  if (!el) return;
  el.innerHTML = r
    ? '<span class="live">' + fmtDist(r.dist) + ' ride · about ' +
      Math.round(r.dur/60) + ' min</span>'
    : '';
}

/* ---------- the plan ---------- */
function setDest(d){
  dest = d;
  pinnedParkId = null;
  $('#q').value = d.label;
  closeResults();
  $('#q').blur();
  saveRecent(d);
  return buildPlan(true);
}

function buildPlan(refit){
  if (!dest) return Promise.resolve();
  var ready = stations.size ? Promise.resolve() : loadStations();
  return ready.then(function(){
    // PARK: nearest rack to the destination that can actually take a bike.
    var parks = preferRoomiest(
      nearest(dest, function(s){ return s.returning && s.docks > 0; }, 5));

    // A rack you picked by hand stays picked, unless it filled up on you.
    if (pinnedParkId){
      var chosen = stations.get(pinnedParkId);
      if (chosen && chosen.returning && chosen.docks > 0){
        var c = {}; for (var k in chosen) c[k] = chosen[k];
        c.dist = haversine(dest, chosen);
        parks = [c].concat(parks.filter(function(s){ return s.id !== pinnedParkId; }));
      } else {
        pinnedParkId = null;
        toast('That rack just filled up — showing the next best one.', 3200);
      }
    }

    // START: the closest rack to where this ride begins. In "need a bike" mode
    // that's the rack you collect from; riding, it's just the nearest one to you.
    var starts = [];
    if (me){
      starts = mode === 'need'
        ? nearest(me, function(s){ return s.renting && s.ebikes > 0; }, 3)
        : nearest(me, function(s){ return s.renting || s.returning; }, 3);
    }

    plan = { park: parks[0], parkAlts: parks.slice(1, 4),
             start: starts[0], startAlts: starts.slice(1) };
    lastPlanAt = Date.now();
    lastPlanPos = me ? { lat:me.lat, lon:me.lon } : null;

    render();
    drawPlan(refit);
  });
}

function drawPlan(refit){
  clearPlanLayers();
  drawMe();
  var pts = [];
  if (me) pts.push([me.lat, me.lon]);
  if (dest){ pin(dest, 'pin-dest', '⚑', dest.label); pts.push([dest.lat, dest.lon]); }
  if (plan && plan.start){
    pin(plan.start, 'pin-start', mode === 'need' ? '\u{1F6B2}' : 'S', plan.start.name);
    pts.push([plan.start.lat, plan.start.lon]);
  }
  if (plan && plan.park){
    pin(plan.park, 'pin-park', 'P', plan.park.name, openSheet);
    pts.push([plan.park.lat, plan.park.lon]);
    plan.parkAlts.forEach(function(a, i){
      // Tapping a backup on the map picks it, same as tapping it in the list.
      pin(a, 'pin-alt', String(i+2), a.name, function(){
        pinnedParkId = a.id;
        openSheet();
        buildPlan(true);
      });
      pts.push([a.lat, a.lon]);
    });
  }
  // Only frame the whole trip on a deliberate change — never on a GPS tick.
  if (refit && pts.length){
    setFollow(false);
    map.fitBounds(L.latLngBounds(pts).pad(0.22), {
      animate:false,
      paddingTopLeft:[20, 90],
      paddingBottomRight:[20, Math.round(window.innerHeight * 0.42)]
    });
  }
  drawRoute();
}

/* Cheap between-replan refresh: distances that move as you do. */
function updateLiveBits(){
  if (!plan || !plan.park || !me) return;
  var el = $('#youMeta');
  if (el){
    var d = haversine(me, plan.park);
    el.textContent = fmtDist(d) + ' from you as the crow flies';
  }
}

function dockClass(n){ return n >= 3 ? 'good' : (n >= 1 ? 'warn' : 'bad'); }
function staleNote(s){
  var age = (Date.now()/1000 - s.reported)/60;
  return age > 30 ? ' · <span class="warn">status ' + Math.round(age) + ' min old</span>' : '';
}

/* ---------- sheet ---------- */
function render(){
  var b = $('#sheetBody'), sheet = $('#sheet');
  var openState = {}, scroll = sheet.scrollTop;
  all(b, 'details[data-k]').forEach(function(d){ openState[d.dataset.k] = d.open; });

  if (!plan || !plan.park){
    b.innerHTML = '<h2>No open dock nearby</h2><p class="sub">Every rack near ' +
      esc(dest ? dest.label : 'there') + ' is full or out of service right now. ' +
      'This refreshes every minute.</p>';
    openSheet();
    return;
  }
  var p = plan.park, h = '';

  h += '<h2>' + esc(dest.label) + '</h2>';
  h += '<p class="sub">' + esc(dest.sub || '') + '</p>';
  h += '<div id="modes">' +
       '<button data-mode="riding" class="' + (mode === 'riding' ? 'on' : '') + '">Already riding</button>' +
       '<button data-mode="need" class="' + (mode === 'need' ? 'on' : '') + '">Need a bike</button>' +
       '</div>';

  /* --- park here --- */
  h += '<div class="card primary">';
  h += '<div class="lbl"><span>Park here — closest rack to your destination</span>' +
       (pinnedParkId ? '<span class="undo" id="unpin">Auto-pick</span>' : '') + '</div>';
  h += '<div class="name">' + esc(p.name) + '</div>';
  h += '<div class="meta"><span class="stat ' + dockClass(p.docks) + '">' + p.docks +
       ' open dock' + (p.docks === 1 ? '' : 's') + '</span> of ' + p.capacity +
       ' · ' + fmtDist(p.dist) + ' from ' + esc(dest.label) +
       ' (' + walkMin(p.dist) + ' min walk)' +
       (p.ebikeOnly ? ' · <span class="warn">corral, lock-to rack</span>' : '') +
       staleNote(p) + '</div>';
  h += '<div class="meta" id="rideMeta" style="margin-top:4px"></div>';
  h += '<div class="meta" id="youMeta" style="margin-top:2px"></div>';
  h += '<div class="row">';
  h += '<a class="btn go" target="_blank" rel="noopener" href="' +
       gmaps(rideOrigin(), p, 'bicycling') + '">Ride here</a>';
  h += '<a class="btn" target="_blank" rel="noopener" href="' +
       gmaps(p, dest, 'walking') + '">Walk the last bit</a>';
  h += '</div>';
  if (p.docks <= 2){
    h += '<p class="meta" style="margin:9px 0 0">Only ' + p.docks + ' dock' +
         (p.docks === 1 ? '' : 's') + ' free — keep a backup in mind.</p>';
  }
  h += '</div>';

  /* --- backups --- */
  if (plan.parkAlts.length){
    h += '<details data-k="alts" open><summary>Backup racks near the destination</summary>';
    plan.parkAlts.forEach(function(a, i){
      h += '<div class="alt" data-alt="' + i + '"><div><b>' + (i+2) + '. ' + esc(a.name) +
           '</b><div class="meta">' + fmtDist(a.dist) + ' away · ' + walkMin(a.dist) +
           ' min walk' + (a.ebikeOnly ? ' · corral' : '') + '</div></div>' +
           '<div class="stat ' + dockClass(a.docks) + '">' + a.docks + ' open</div></div>';
    });
    h += '</details>';
  }

  /* --- where the ride starts --- */
  h += '<div class="card">';
  if (plan.start){
    var g = plan.start;
    h += '<div class="lbl">' + (mode === 'need'
          ? 'Grab an e-bike — closest to you now'
          : 'Route starts here — closest rack to you') + '</div>';
    h += '<div class="name">' + esc(g.name) + '</div>';
    h += '<div class="meta">' +
         '<span class="stat ' + (g.ebikes > 0 ? 'good' : 'muted') + '">' + g.ebikes +
         ' e-bike' + (g.ebikes === 1 ? '' : 's') + '</span>' +
         ' · <span class="stat ' + dockClass(g.docks) + '">' + g.docks + ' open dock' +
         (g.docks === 1 ? '' : 's') + '</span>' +
         ' · ' + fmtDist(g.dist) + ' · ' + walkMin(g.dist) + ' min walk' +
         (g.ebikeOnly ? ' · corral' : '') + staleNote(g) + '</div>';
    h += '<div class="row"><a class="btn" target="_blank" rel="noopener" href="' +
         gmaps(me, g, 'walking') + '">' +
         (mode === 'need' ? 'Walk to the bike' : 'Walk to this rack') + '</a></div>';
    if (plan.startAlts.length){
      h += '<details data-k="starts"><summary>Other racks near you</summary>';
      plan.startAlts.forEach(function(a){
        h += '<div class="alt"><div><b>' + esc(a.name) + '</b><div class="meta">' +
             fmtDist(a.dist) + ' · ' + walkMin(a.dist) + ' min walk</div></div>' +
             '<div class="stat ' + (a.ebikes > 0 ? 'good' : '') + '">' + a.ebikes +
             ' e-bike' + (a.ebikes === 1 ? '' : 's') + '</div></div>';
      });
      h += '</details>';
    }
  } else if (!me){
    h += '<div class="lbl">Where you’re starting</div>';
    h += '<div class="meta">Tap ◎ up top to turn on live location — then this shows ' +
         'the closest rack to your start and the real ride distance.</div>';
  } else {
    h += '<div class="lbl">Grab an e-bike</div>';
    h += '<div class="meta">No rack near you has an e-bike right now.</div>';
  }
  h += '</div>';

  b.innerHTML = h;

  // Restore whatever the user had expanded, and where they'd scrolled to.
  all(b, 'details[data-k]').forEach(function(d){
    if (Object.prototype.hasOwnProperty.call(openState, d.dataset.k)) d.open = openState[d.dataset.k];
  });
  sheet.scrollTop = scroll;

  all(b, '[data-mode]').forEach(function(el){
    el.addEventListener('click', function(){
      if (mode === el.dataset.mode) return;
      mode = el.dataset.mode;
      try{ localStorage.setItem('bdf.mode', mode); }catch(e){}
      buildPlan(true);
    });
  });
  all(b, '[data-alt]').forEach(function(el){
    el.addEventListener('click', function(){
      pinnedParkId = plan.parkAlts[+el.dataset.alt].id;
      buildPlan(true);
    });
  });
  var un = $('#unpin');
  if (un) un.addEventListener('click', function(){ pinnedParkId = null; buildPlan(true); });

  updateLiveBits();
  $('#foot').textContent = 'Live Bay Wheels data · updated ' +
    new Date(statusAt).toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
  openSheet();
}

function openSheet(){
  $('#sheet').classList.add('on');
  $('#peek').classList.remove('on');
}
function collapseSheet(){
  $('#sheet').classList.remove('on');
  if (plan && plan.park){
    $('#peek').innerHTML = '<div><b>' + esc(plan.park.name) + '</b>' +
      '<div class="meta"><span class="' + dockClass(plan.park.docks) + '">' +
      plan.park.docks + ' open</span> · ' + walkMin(plan.park.dist) + ' min walk to ' +
      esc(dest.label) + '</div></div><div class="meta">▲</div>';
    $('#peek').classList.add('on');
  }
}
/* Drag the grip down to tuck the sheet away; it snaps back if you don't mean it. */
function wireSheetDrag(){
  var sheet = $('#sheet'), wrap = $('#gripWrap');
  var startY = null, dy = 0, h = 0, moved = false;

  function down(y){
    startY = y; dy = 0; moved = false;
    h = sheet.getBoundingClientRect().height;
    sheet.style.transition = 'none';
  }
  function move(y){
    if (startY === null) return;
    dy = Math.max(0, y - startY);
    if (dy > 4) moved = true;
    sheet.style.transform = 'translateY(' + dy + 'px)';
  }
  function up(){
    if (startY === null) return;
    sheet.style.transition = '';
    sheet.style.transform = '';
    if (moved && dy > Math.min(90, h * 0.3)) collapseSheet();
    startY = null;
  }
  wrap.addEventListener('touchstart', function(e){ down(e.touches[0].clientY); }, { passive:true });
  wrap.addEventListener('touchmove',  function(e){ move(e.touches[0].clientY); }, { passive:true });
  wrap.addEventListener('touchend',   up, { passive:true });
  wrap.addEventListener('touchcancel',up, { passive:true });
  wrap.addEventListener('click', function(){ if (!moved) collapseSheet(); });
  $('#peek').addEventListener('click', openSheet);
}

/* ---------- recents ---------- */
function saveRecent(d){
  try{
    var r = JSON.parse(localStorage.getItem('bdf.recent') || '[]')
              .filter(function(x){ return x.label !== d.label; });
    r.unshift({ lat:d.lat, lon:d.lon, label:d.label, sub:d.sub });
    localStorage.setItem('bdf.recent', JSON.stringify(r.slice(0,6)));
  }catch(e){}
}
function getRecent(){
  try{ return JSON.parse(localStorage.getItem('bdf.recent') || '[]'); }catch(e){ return []; }
}
function openResults(){ $('#results').classList.add('on'); document.body.classList.add('searching'); }
function closeResults(){ $('#results').classList.remove('on'); document.body.classList.remove('searching'); }

function showRecent(){
  var r = getRecent(), box = $('#results');
  if (!r.length){ closeResults(); return; }
  box.innerHTML = '<div class="res hint">Recent destinations</div>' +
    r.map(function(x, i){
      return '<div class="res" data-rec="' + i + '"><b>' + esc(x.label) + '</b><span>' +
             esc(x.sub || '') + '</span></div>';
    }).join('');
  all(box, '[data-rec]').forEach(function(el){
    el.addEventListener('click', function(){ setDest(r[+el.dataset.rec]); });
  });
  openResults();
}

/* ---------- search wiring ---------- */
var searchTimer, searchToken = 0;
function wire(){
  var q = $('#q'), box = $('#results');

  q.addEventListener('input', function(){
    clearTimeout(searchTimer);
    var v = q.value.trim();
    if (v.length < 3){ showRecent(); return; }
    searchTimer = setTimeout(function(){
      var token = ++searchToken;
      box.innerHTML = '<div class="res hint">Searching…</div>';
      openResults();
      geocode(v).then(function(hits){
        if (token !== searchToken) return;       // an older query finishing late
        if (!hits.length){
          box.innerHTML = '<div class="res hint">Nothing found around the Bay</div>';
          return;
        }
        box.innerHTML = hits.map(function(h, i){
          return '<div class="res" data-i="' + i + '"><b>' + esc(h.label) + '</b><span>' +
                 esc(h.sub || '') + '</span></div>';
        }).join('');
        all(box, '[data-i]').forEach(function(el){
          el.addEventListener('click', function(){ setDest(hits[+el.dataset.i]); });
        });
      }).catch(function(){
        if (token !== searchToken) return;
        box.innerHTML = '<div class="res hint">Search is unavailable right now</div>';
      });
    }, 350);
  });

  q.addEventListener('focus', function(){ if (q.value.trim().length < 3) showRecent(); });
  q.addEventListener('keydown', function(e){
    if (e.key === 'Enter'){
      e.preventDefault();
      var f = box.querySelector('[data-i],[data-rec]');
      if (f) f.click(); else q.blur();
    }
  });
  $('#clearBtn').addEventListener('click', function(){
    q.value = ''; dest = null; plan = null; pinnedParkId = null;
    closeResults();
    $('#sheet').classList.remove('on');
    $('#peek').classList.remove('on');
    clearPlanLayers();
    if (me){ setFollow(true); map.setView([me.lat, me.lon], 16); }
  });
  $('#locBtn').addEventListener('click', function(){ startWatch(true); });

  // Tapping the map dismisses the keyboard/results without losing the plan.
  map.on('click', function(){ closeResults(); $('#q').blur(); });

  wireSheetDrag();
}

/* ---------- boot ---------- */
try{ mode = localStorage.getItem('bdf.mode') || 'riding'; }catch(e){}
initMap();
wire();
setGeo('off');

toast('Loading Bay Wheels racks…', 0);
loadStations().then(function(){
  hideToast();
  if (dest) buildPlan(true);
}).catch(function(){
  toast('Could not reach the Bay Wheels feed. Check your connection.', 5000);
});

startWatch(false);

setInterval(function(){
  refreshStatus().then(function(){
    if (dest) buildPlan(false);      // refresh the numbers, don't move the map
  }).catch(function(){});
}, REFRESH_MS);

// Re-check the moment you come back to the app — the numbers will be stale.
document.addEventListener('visibilitychange', function(){
  if (document.visibilityState === 'visible' && Date.now() - statusAt > 30000){
    refreshStatus().then(function(){ if (dest) buildPlan(false); }).catch(function(){});
  }
});

if ('serviceWorker' in navigator && window.isSecureContext){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
</script>
</body>
